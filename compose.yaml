services:
  postgres:
    image: postgres:18-alpine
    container_name: kovago-postgres

    environment:
      POSTGRES_DB: kovago
      POSTGRES_USER: kovago
      POSTGRES_PASSWORD: kovago

    ports:
      - "5433:5432"

    volumes:
      - kovago-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovago -d kovago"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  kovago-postgres-data:
